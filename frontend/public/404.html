<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fresh Market 🌿</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      var path = window.location.pathname;
      var repo = '/-PREMIUM-FRESH-MARKET-UI-REDESIGN';
      if (path.startsWith(repo)) {
        var subpath = path.slice(repo.length);
        if (subpath === '' || subpath === '/') {
          window.location.replace(repo + '/');
        } else {
          window.location.replace(repo + '/#' + subpath + window.location.search + window.location.hash);
        }
      } else {
        window.location.replace('/#' + path + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body>
    <p>Redirecting to Fresh Market...</p>
  </body>
</html>
